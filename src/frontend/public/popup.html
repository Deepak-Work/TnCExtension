<!DOCTYPE html>
<html>
    <head>
        <title>Terms and Conditions Summary</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="loading-screen" class="loading-container">
            <div class="spinner"></div>
            <p>Analyzing Terms & Conditions...</p>
        </div>

        <div id="empty-screen" class="loading-container" style="display: none;">
            <p>No Terms & Conditions detected on this page yet.</p>
        </div>

        <div id="content" class="container" style="display: none;">
            <h1 class="title" id="page-title">Terms Summary</h1>

            <div class="section">
                <div class="label">Page URL</div>
                <div id="url" class="box"></div>
            </div>

            <div id="error-message" class="box warning" style="display: none;"></div>

            <div class="section">
                <div class="label">Good for you</div>
                <div id="good" class="box success"></div>
            </div>

            <div class="section">
                <div class="label">Red flags</div>
                <div id="bad" class="box warning"></div>
            </div>

            <div class="section">
                <div class="label">What people are saying</div>
                <div id="sentiment" class="box"></div>
            </div>

            <div class="section">
                <div id="meta" class="box" style="font-size: 12px; color: #64748b;"></div>
            </div>
        </div>
        <script src="../popup.js" type="module"></script>
    </body>
</html>
